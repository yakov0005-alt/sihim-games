<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>קפיצות בכנרת | שיאים</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../shared/sihim.css"><link rel="stylesheet" href="style.css"></head><body><canvas id="game" aria-label="אגם הכנרת בשקיעה, גררו ושחררו כדי לזרוק אבן"></canvas><div class="heading"><span>רגע קטן על המים</span><h1>קפיצות בכנרת</h1><div id="status">עשר אבנים. כמה רחוק תגיעו?</div></div><div id="feedback" aria-live="polite"></div><div class="dock"><div class="topline"><div class="modes"><button id="free" class="selected">חופשי</button><button id="targets">מטרות</button></div><span id="throws">אבן 1 / 10</span></div><div class="settings"><label>עוצמה <output id="pv"></output><input id="power" aria-label="עוצמה" type="range" min="30" max="100" value="78"></label><label>זווית <output id="av"></output><input id="angle" step="0.1" aria-label="זווית" type="range" min="5" max="35" value="13"></label><label>סחרור <output id="sv"></output><input id="spin" step="0.1" aria-label="סחרור" type="range" min="0" max="100" value="75"></label></div><button id="throw">זרקו אבן <span>↗</span></button><p id="hint">גררו על האגם ושחררו · חצים לכיוון וזווית · רווח לעוצמה ושחרור · א / ד לסחרור</p></div><script src="../../shared/sihim.js"></script><script type="module" src="game.js"></script></body></html>
