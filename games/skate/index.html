<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>גולש הסופה | שיאים</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../shared/sihim.css">
<link rel="stylesheet" href="style.css">
<canvas id="game"></canvas>
<div class="topbar"><span class="hearts" id="hearts"></span><span class="comboTxt" id="comboTxt"></span><span class="stageTxt" id="stageTxt"></span></div>
<div class="hint">רווח או חץ למעלה לזינוק מהרמפה · 1-2-3 או הכפתורים לטריקים באוויר</div>
<div class="controls">
  <button class="trick" id="tr-kickflip" data-hint="1">קיקפליפ</button>
  <button class="trick" id="tr-grab" data-hint="2">גראב</button>
  <button class="trick" id="tr-spin" data-hint="3">ספין</button>
</div>
<div class="preload" id="preload">
  <div class="preload-bar"><div class="preload-fill" id="preloadFill"></div></div>
  <div class="preload-txt" id="preloadTxt">טוען… 0%</div>
</div>
<script>if(new URLSearchParams(location.search).get('mute')==='1') localStorage.setItem('sihim:sound','0');</script>
<script src="../../shared/sihim.js"></script>
<script type="module" src="game.js"></script>
</html>
