<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עין של צבעים | שיאים</title><link rel="stylesheet" href="../../shared/sihim.css"><style>body{background:#101723}#studio{position:fixed;inset:85px 20px 25px;max-width:760px;margin:auto;display:flex;flex-direction:column;justify-content:center;gap:20px}.eyebrow{color:#9db3bf;font-size:12px;letter-spacing:2px}h2{font-size:clamp(24px,4vw,40px);margin:7px 0}.top{display:flex;justify-content:space-between;align-items:end}.counter{color:#f9c67c;font-size:16px}.swatches{display:grid;grid-template-columns:1fr 1fr;gap:16px}.swatch{height:190px;border-radius:22px;position:relative;border:1px solid #ffffff24;box-shadow:inset 0 0 40px #ffffff08,0 14px 35px #0003;transition:background .12s}.tag{position:absolute;bottom:14px;right:15px;background:#101723b8;padding:6px 12px;border-radius:20px;font-size:13px}.mix{background:#1a2432;border:1px solid #ffffff12;border-radius:22px;padding:20px 24px;display:grid;gap:17px}.channel{display:grid;grid-template-columns:62px 1fr 32px;gap:15px;align-items:center;font-size:14px}.channel output{font-variant-numeric:tabular-nums;text-align:left;color:#b4c4d4}input{width:100%;direction:ltr;accent-color:var(--color);cursor:pointer;height:20px;touch-action:pan-x}button#match{border:0;border-radius:14px;background:#f5c783;color:#1b2532;font:800 18px Rubik,system-ui;padding:15px;cursor:pointer;width:100%;box-shadow:0 4px 0 #977044}button#match:disabled{opacity:.75}.foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#9db3bf}.feedback{min-height:24px;color:#f5d39e;text-align:center;font-size:15px}.progress{display:flex;gap:5px}.progress i{flex:1;height:4px;background:#ffffff20;border-radius:3px}.progress i.done{background:#efc489}.sh-hud .sh-pill{padding:6px 9px;font-size:13px}@media(max-width:500px){#studio{inset:82px 20px 20px;gap:18px}.swatch{height:185px}.mix{padding:20px 16px}.channel{gap:8px;grid-template-columns:50px 1fr 29px}.foot{font-size:11px}h2{font-size:28px}.swatches{gap:12px}}</style><canvas id="game"></canvas><main id="studio"><div class="top"><div><div class="eyebrow">מעבדת גוונים</div><h2>לכל צבע יש מתכון.</h2></div><span class="counter" id="round">סבב 1</span></div><div class="progress" id="progress"></div><div class="swatches"><div class="swatch" id="target"><span class="tag">צבע המטרה</span></div><div class="swatch" id="yours"><span class="tag">הגוון שלכם</span></div></div><div class="mix"><label class="channel" style="--color:#ff8386"><span>אדום</span><input id="red" aria-label="אדום" type="range" min="0" max="255" value="128"><output>128</output></label><label class="channel" style="--color:#73e7b0"><span>ירוק</span><input id="green" aria-label="ירוק" type="range" min="0" max="255" value="128"><output>128</output></label><label class="channel" style="--color:#83b9ff"><span>כחול</span><input id="blue" aria-label="כחול" type="range" min="0" max="255" value="128"><output>128</output></label></div><div class="feedback" id="feedback">ערבבו שלושה אורות עד שהגוונים נפגשים.</div><button id="match">בודקים את הגוון ←</button><div class="foot"><span>חצים לשינוי · מעלה ומטה לבחירת צבע</span><span id="timer">עשר הזדמנויות לעין חדה</span></div></main><script src="../../shared/sihim.js"></script><script src="game.js"></script></html>
